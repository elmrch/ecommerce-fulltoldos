<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/logofulltoldos.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado — Full Toldos</title>
    <meta name="robots" content="noindex,nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
            <p>Acceso denegado</p>
        </div>

        <div class="login-body" style="text-align:center;">

            <i class="bi bi-shield-lock-fill" style="font-size:3rem;color:#d32f2f;"></i>

            <h5 style="margin-top:.75rem;">No tienes permiso para ver esta página</h5>
            <p style="color:#666;margin-bottom:1.5rem;">
                Tu cuenta no cuenta con los privilegios necesarios para acceder a esta sección.
                Si crees que es un error, contáctanos por WhatsApp.
            </p>

            <a th:href="@{/}" class="btn-login" style="text-decoration:none;display:inline-flex;">
                <i class="bi bi-house-door"></i>
                Volver al inicio
            </a>

        </div>
    </div>

    <div class="back-home">
        <a th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
            Iniciar sesión con otra cuenta
        </a>
    </div>
</div>

</body>
</html>
