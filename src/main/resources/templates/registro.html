<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/logofulltoldos.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Full Toldos</title>
    <meta name="robots" content="noindex,follow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="reg-wrapper">
    <div class="reg-card">

        <div class="reg-header">
            <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
            <p>Crea tu cuenta y empieza a cotizar</p>
        </div>

        <div class="reg-body">

            <!-- Error del servidor -->
            <div class="alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/registro}" method="post" id="formRegistro">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <div class="input-wrap">
                        <input type="text" name="nombre" class="form-control"
                               placeholder="Juan Pérez" required minlength="3">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <div class="input-wrap">
                        <input type="email" name="email" class="form-control"
                               placeholder="tucorreo@email.com" required>
                        <i class="bi bi-envelope"></i>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password" id="pass1" name="password"
                               class="form-control" placeholder="Mínimo 6 caracteres"
                               required minlength="6">
                        <i class="bi bi-eye toggle-pass" id="togglePass1"
                           onclick="togglePass('pass1','togglePass1')"></i>
                    </div>
                    <div class="pass-hint">
                        <i class="bi bi-info-circle"></i> Mínimo 6 caracteres
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div class="mb-4">
                    <label class="form-label">Confirmar contraseña</label>
                    <div class="input-wrap">
                        <input type="password" id="pass2" name="confirmar"
                               class="form-control" placeholder="Repite tu contraseña"
                               required minlength="6">
                        <i class="bi bi-eye toggle-pass" id="togglePass2"
                           onclick="togglePass('pass2','togglePass2')"></i>
                    </div>
                    <div id="passMatch" class="pass-hint" style="display:none;color:#c62828;">
                        <i class="bi bi-x-circle"></i> Las contraseñas no coinciden
                    </div>
                </div>

                <button type="submit" class="btn-registrar" id="btnRegistrar">
                    <i class="bi bi-person-check-fill"></i>
                    Crear mi cuenta
                </button>
            </form>

            <div class="divider">¿Ya tienes cuenta?</div>

            <a th:href="@{/login}" class="btn-login-link">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
            </a>

        </div>
    </div>

    <div class="back-home">
        <a th:href="@{/}">
            <i class="bi bi-arrow-left"></i>
            Volver a la tienda
        </a>
    </div>
</div>

<script>
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }

    // Validación en tiempo real de contraseñas
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const hint  = document.getElementById('passMatch');
    const btn   = document.getElementById('btnRegistrar');

    function checkPasswords() {
      if (pass2.value.length > 0 && pass1.value !== pass2.value) {
        hint.style.display = 'flex';
        btn.disabled = true;
        btn.style.opacity = '0.6';
      } else {
        hint.style.display = 'none';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }
    pass1.addEventListener('input', checkPasswords);
    pass2.addEventListener('input', checkPasswords);
</script>

</body>
</html>
