<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
    <style>
        body {
          background: #f0f4ff;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Poppins', sans-serif;
        }
        .reg-wrapper { width: 100%; max-width: 460px; padding: 20px; }
        .reg-card {
          background: white;
          border-radius: 20px;
          box-shadow: 0 8px 40px rgba(25,73,201,0.13);
          overflow: hidden;
        }
        .reg-header {
          background: #1949c9;
          padding: 28px 36px 24px;
          text-align: center;
        }
        .reg-header img { height: 46px; filter: brightness(0) invert(1); margin-bottom: 8px; }
        .reg-header p  { color: rgba(255,255,255,0.7); font-size: 0.8rem; margin: 0; }
        .reg-body { padding: 28px 36px 36px; }
        .form-label {
          font-size: 0.65rem; letter-spacing: 2px;
          text-transform: uppercase; color: #1949c9;
          font-weight: 700; margin-bottom: 5px;
        }
        .form-control {
          border: 1.5px solid #e0e0e0; border-radius: 10px;
          padding: 10px 42px 10px 13px;
          font-family: 'Poppins', sans-serif; font-size: 0.9rem;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
          border-color: #1949c9;
          box-shadow: 0 0 0 3px rgba(25,73,201,0.1);
        }
        .input-wrap { position: relative; }
        .input-wrap i {
          position: absolute; right: 13px; top: 50%;
          transform: translateY(-50%);
          color: #b0bec5; font-size: 0.95rem;
        }
        .toggle-pass { cursor: pointer; pointer-events: all !important; }
        .alert-error {
          background: #fce4ec; border: 1px solid #ef9a9a;
          border-radius: 10px; color: #c62828;
          padding: 10px 15px; font-size: 0.82rem;
          display: flex; align-items: center; gap: 8px;
          margin-bottom: 18px;
        }
        .btn-registrar {
          width: 100%;
          background: linear-gradient(135deg, #1949c9, #1237a8);
          color: white; border: none; padding: 13px;
          border-radius: 10px;
          font-family: 'Poppins', sans-serif;
          font-weight: 700; font-size: 0.92rem;
          cursor: pointer; transition: all 0.2s;
          display: flex; align-items: center;
          justify-content: center; gap: 8px; margin-top: 6px;
        }
        .btn-registrar:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(25,73,201,0.35);
        }
        .divider {
          display: flex; align-items: center;
          gap: 12px; margin: 20px 0;
          color: #b0bec5; font-size: 0.75rem;
        }
        .divider::before, .divider::after {
          content: ''; flex: 1; height: 1px; background: #e0e0e0;
        }
        .btn-login-link {
          width: 100%; background: transparent;
          color: #1949c9; border: 1.5px solid #1949c9;
          padding: 11px; border-radius: 10px;
          font-family: 'Poppins', sans-serif;
          font-weight: 700; font-size: 0.88rem;
          cursor: pointer; transition: all 0.2s;
          text-decoration: none;
          display: flex; align-items: center;
          justify-content: center; gap: 8px;
        }
        .btn-login-link:hover { background: #1949c9; color: white; }
        .back-home { text-align: center; margin-top: 18px; }
        .back-home a {
          font-size: 0.76rem; color: #90a4ae;
          text-decoration: none;
          display: inline-flex; align-items: center; gap: 5px;
          transition: color 0.2s;
        }
        .back-home a:hover { color: #1949c9; }
        .pass-hint {
          font-size: 0.7rem; color: #90a4ae;
          margin-top: 4px; display: flex;
          align-items: center; gap: 4px;
        }
    </style>
</head>
<body>

<div class="reg-wrapper">
    <div class="reg-card">

        <div class="reg-header">
            <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
            <p>Crea tu cuenta y empieza a cotizar</p>
        </div>

        <div class="reg-body">

            <!-- Error del servidor -->
            <div class="alert-error" th:if="${error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/registro}" method="post" id="formRegistro">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <div class="input-wrap">
                        <input type="text" name="nombre" class="form-control"
                               placeholder="Juan Pérez" required minlength="3">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <div class="input-wrap">
                        <input type="email" name="email" class="form-control"
                               placeholder="tucorreo@email.com" required>
                        <i class="bi bi-envelope"></i>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password" id="pass1" name="password"
                               class="form-control" placeholder="Mínimo 6 caracteres"
                               required minlength="6">
                        <i class="bi bi-eye toggle-pass" id="togglePass1"
                           onclick="togglePass('pass1','togglePass1')"></i>
                    </div>
                    <div class="pass-hint">
                        <i class="bi bi-info-circle"></i> Mínimo 6 caracteres
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div class="mb-4">
                    <label class="form-label">Confirmar contraseña</label>
                    <div class="input-wrap">
                        <input type="password" id="pass2" name="confirmar"
                               class="form-control" placeholder="Repite tu contraseña"
                               required minlength="6">
                        <i class="bi bi-eye toggle-pass" id="togglePass2"
                           onclick="togglePass('pass2','togglePass2')"></i>
                    </div>
                    <div id="passMatch" class="pass-hint" style="display:none;color:#c62828;">
                        <i class="bi bi-x-circle"></i> Las contraseñas no coinciden
                    </div>
                </div>

                <button type="submit" class="btn-registrar" id="btnRegistrar">
                    <i class="bi bi-person-check-fill"></i>
                    Crear mi cuenta
                </button>
            </form>

            <div class="divider">¿Ya tienes cuenta?</div>

            <a th:href="@{/login}" class="btn-login-link">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar sesión
            </a>

        </div>
    </div>

    <div class="back-home">
        <a th:href="@{/}">
            <i class="bi bi-arrow-left"></i>
            Volver a la tienda
        </a>
    </div>
</div>

<script>
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon  = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }

    // Validación en tiempo real de contraseñas
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const hint  = document.getElementById('passMatch');
    const btn   = document.getElementById('btnRegistrar');

    function checkPasswords() {
      if (pass2.value.length > 0 && pass1.value !== pass2.value) {
        hint.style.display = 'flex';
        btn.disabled = true;
        btn.style.opacity = '0.6';
      } else {
        hint.style.display = 'none';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }
    pass1.addEventListener('input', checkPasswords);
    pass2.addEventListener('input', checkPasswords);
</script>

</body>
</html>
