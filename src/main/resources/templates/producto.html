<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/logofulltoldos.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle != null ? pageTitle : 'FULL TOLDOS — Toldos & Carpas Profesionales'}">FULL TOLDOS — Toldos &amp; Carpas Profesionales</title>
    <meta name="description" th:content="${metaDescription ?: 'Toldos, carpas e inflables publicitarios a medida en Perú. Fabricación propia, más de 25 años de experiencia, envíos a todo el país.'}">
    <link rel="canonical" th:href="${ogUrl}">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Full Toldos">
    <meta property="og:locale" content="es_PE">
    <meta property="og:title" th:content="${pageTitle != null ? pageTitle : 'FULL TOLDOS — Toldos & Carpas Profesionales'}">
    <meta property="og:description" th:content="${metaDescription ?: 'Toldos, carpas e inflables publicitarios a medida en Perú. Fabricación propia, más de 25 años de experiencia, envíos a todo el país.'}">
    <meta property="og:url" th:content="${ogUrl}">
    <meta property="og:image" th:content="${ogImage}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${pageTitle != null ? pageTitle : 'FULL TOLDOS — Toldos & Carpas Profesionales'}">
    <meta name="twitter:description" th:content="${metaDescription ?: 'Toldos, carpas e inflables publicitarios a medida en Perú. Fabricación propia, más de 25 años de experiencia, envíos a todo el país.'}">
    <meta name="twitter:image" th:content="${ogImage}">
    <script type="application/ld+json" th:if="${producto != null}" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": [[${producto.nombre}]],
      "description": [[${metaDescription}]],
      "image": [[${ogImage}]],
      "sku": [[${producto.id}]],
      "offers": {
        "@type": "Offer",
        "url": [[${ogUrl}]],
        "priceCurrency": "PEN",
        "price": [[${precioFinal}]],
        "availability": [[${producto.agotado ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock'}]],
        "itemCondition": "https://schema.org/NewCondition"
      }
    }
    </script>
    <script type="application/ld+json" th:if="${producto != null and categoriaNombre != null}" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Inicio", "item": [[${siteUrl}]]},
        {"@type": "ListItem", "position": 2, "name": [[${categoriaNombre}]], "item": [[${siteUrl + '/categoria/' + categoriaSlug}]]},
        {"@type": "ListItem", "position": 3, "name": [[${producto.nombre}]], "item": [[${ogUrl}]]}
      ]
    }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:wght@400;600;700;800;900&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<!-- ═══ PRODUCT PAGE VIEW ═══ -->
<div id="prodPageView" style="background:#ffffff; min-height:100vh; padding-top:148px;">
    <div class="prod-page-topbar">
        <div class="container">
            <div id="prodBreadcrumb" class="prod-breadcrumb"></div>
            <div class="prod-nav-arrows">
                <button class="prod-nav-btn" id="prodNavPrevBtn" onclick="prodNavPrev()" title="Producto anterior"><i class="bi bi-chevron-left"></i></button>
                <button class="prod-nav-btn" onclick="closeProdPage()" title="Volver a categoría"><i class="bi bi-grid-3x3-gap"></i></button>
                <button class="prod-nav-btn" id="prodNavNextBtn" onclick="prodNavNext()" title="Producto siguiente"><i class="bi bi-chevron-right"></i></button>
            </div>
        </div>
    </div>
    <div class="container" style="padding:28px 12px 60px;">
        <div class="row g-4 align-items-start">
            <div class="col-lg-6 prod-img-col">
                <div class="prod-img-section">
                    <div class="prod-thumb-col">
                        <button class="pthumb-arrow" id="pthumbUp" onclick="pthumbScroll(-1)"><i class="bi bi-chevron-up"></i></button>
                        <div class="prod-thumb-viewport">
                            <div class="prod-thumb-strip" id="prodThumbStrip"></div>
                        </div>
                        <button class="pthumb-arrow" id="pthumbDown" onclick="pthumbScroll(1)"><i class="bi bi-chevron-down"></i></button>
                    </div>
                    <div class="prod-main-img-area" onclick="openProdImgLightbox(currentImgIdx)">
                        <img id="prodMainImg" src="" alt="">
                        <div class="prod-img-expand-hint"><i class="bi bi-fullscreen"></i></div>
                    </div>
                </div>
                <div class="prod-fullview-link" onclick="openGalleryModal()">
                    <i class="bi bi-images"></i> Ver todos los medios
                </div>
            </div>
            <div class="col-lg-6">
                <div class="prod-info-card" id="prodInfoCard"></div>
            </div>
        </div>
        <div id="prodTecSection"></div>
        <div id="prodTabsSection" style="margin-top:40px;"></div>
        <div id="prodRelatedSection"></div>
        <div id="prodTambienSection"></div>
        <div id="prodVistoSection"></div>
    </div>
</div>

<!-- ═══ GALLERY FULL VIEW MODAL ═══ -->
<div id="galleryModal" class="gallery-modal-overlay" onclick="closeGalleryModal(event)">
    <div class="gallery-modal-box">
        <button class="gallery-modal-close" onclick="closeGalleryModal()"><i class="bi bi-x-lg"></i></button>
        <!-- Tabs bar -->
        <div class="gallery-modal-tabs-bar">
            <div class="gallery-tabs">
                <button class="gallery-tab active" id="tabVids" onclick="switchGalleryTab('vids')">VIDEOS</button>
                <button class="gallery-tab" id="tabImgs" onclick="switchGalleryTab('imgs')">IMÁGENES</button>
            </div>
        </div>
        <!-- Body: left player + right sidebar -->
        <div class="gallery-modal-body">
            <!-- Left: main viewer + meta -->
            <div class="gallery-main-side">
                <div class="gallery-main-view" id="galleryMainView">
                    <img id="galleryMainImg" src="" alt="" style="display:none;">
                    <div id="galleryMainVid" style="display:none; width:100%; height:100%; align-items:center; justify-content:center;"></div>
                </div>
                <div class="gallery-media-feedback">
                    <div class="gallery-useful-row">
                        <span>¿Te resultó útil?</span>
                        <button class="gallery-like-btn" id="galleryLikeBtn" onclick="galleryToggleLike(this)">
                            <i class="bi bi-hand-thumbs-up"></i> <span id="galleryLikeCount">0</span>
                        </button>
                    </div>
                    <button class="gallery-share-btn" onclick="shareProduct()" title="Compartir">
                        <i class="bi bi-share-fill"></i>
                    </button>
                </div>
                <div class="gallery-media-title" id="galleryMediaTitle"></div>
                <div class="gallery-media-author" id="galleryMediaAuthor"></div>
            </div>
            <!-- Right: sidebar list -->
            <div class="gallery-sidebar-panel" id="galleryThumbPanel"></div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/chrome :: chrome}"></div>

</body>
</html>
