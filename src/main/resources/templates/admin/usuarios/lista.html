<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Full Toldos Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="admin-page">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
        <div class="sidebar-role"><i class="bi bi-shield-fill-check"></i> Panel Admin</div>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-lbl">Principal</span>
        <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <span class="nav-section-lbl">Gestion</span>
        <a th:href="@{/admin/productos}" class="nav-item"><i class="bi bi-box-seam"></i> Productos</a>
        <a th:href="@{/admin/categorias}" class="nav-item"><i class="bi bi-tags"></i> Categorias</a>
        <a th:href="@{/admin/pedidos}" class="nav-item"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a th:href="@{/admin/cotizaciones}" class="nav-item"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
        <a th:href="@{/admin/usuarios}" class="nav-item active"><i class="bi bi-people"></i> Usuarios</a>
        <span class="nav-section-lbl">Tienda</span>
        <a th:href="@{/}" class="nav-item"><i class="bi bi-shop"></i> Ver tienda</a>
    </nav>
    <div class="sidebar-foot">
        <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="user-email" sec:authentication="name">admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Cerrar sesion</button>
        </form>
    </div>
</aside>

<!-- Contenido -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">Usuarios</h1>
    </div>

    <!-- Alertas -->
    <div class="alert-exito" th:if="${exito}">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span>
    </div>
    <div class="alert-error" th:if="${error}">
        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
    </div>

    <!-- Stats -->
    <div class="stat-row">
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#e3f2fd;">
                <i class="bi bi-people-fill" style="color:#1949c9;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${usuarios.size()}">0</div>
                <div class="stat-mini-lbl">Total usuarios</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#e8f5e9;">
                <i class="bi bi-person-check-fill" style="color:#2e7d32;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${totalClientes}">0</div>
                <div class="stat-mini-lbl">Clientes</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#f3e5f5;">
                <i class="bi bi-shield-fill-check" style="color:#6a1b9a;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${totalAdmins}">0</div>
                <div class="stat-mini-lbl">Admins</div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card-admin">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="user-avatar-sm"
                             th:text="${#strings.toUpperCase(#strings.substring(u.nombre,0,1))}">A</div>
                        <strong th:text="${u.nombre}"></strong>
                    </div>
                </td>
                <td th:text="${u.email}"></td>
                <td>
                    <span class="badge-admin" th:if="${u.rol.name() == 'ROLE_ADMIN'}">Admin</span>
                    <span class="badge-cliente" th:if="${u.rol.name() == 'ROLE_CLIENTE'}">Cliente</span>
                </td>
                <td>
                    <span class="badge-activo" th:if="${u.activo}">Activo</span>
                    <span class="badge-inactivo" th:if="${!u.activo}">Inactivo</span>
                </td>
                <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <!-- Ver detalle -->
                        <a th:href="@{/admin/usuarios/detalle/{id}(id=${u.id})}"
                           class="btn-accion btn-ver">
                            <i class="bi bi-eye"></i> Ver
                        </a>
                        <!-- Activar/Desactivar -->
                        <form th:action="@{/admin/usuarios/estado/{id}(id=${u.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="activo" th:value="${!u.activo}">
                            <button type="submit" class="btn-accion"
                                    th:classappend="${u.activo} ? 'btn-eliminar' : 'btn-ver'">
                                <i th:class="${u.activo} ? 'bi bi-person-slash' : 'bi bi-person-check'"></i>
                                <span th:text="${u.activo} ? 'Desactivar' : 'Activar'"></span>
                            </button>
                        </form>
                        <!-- Eliminar -->
                        <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('¿Eliminar este usuario?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn-accion btn-eliminar">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
