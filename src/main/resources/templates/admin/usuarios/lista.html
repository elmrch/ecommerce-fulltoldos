<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Full Toldos Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background:#f0f4ff; font-family:'Poppins',sans-serif; margin:0; }
        .sidebar { position:fixed; top:0; left:0; width:240px; height:100vh; background:#111; display:flex; flex-direction:column; z-index:100; }
        .sidebar-logo { padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-logo img { height:40px; filter:brightness(0) invert(1); }
        .sidebar-role { font-size:0.58rem; letter-spacing:2px; text-transform:uppercase; color:#1949c9; font-weight:700; margin-top:6px; }
        .sidebar-nav { flex:1; padding:16px 10px; overflow-y:auto; }
        .nav-section-lbl { font-size:0.55rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.25); padding:10px 10px 6px; display:block; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,0.55); text-decoration:none; font-size:0.82rem; font-weight:500; transition:all 0.18s; margin-bottom:2px; }
        .nav-item:hover { background:rgba(255,255,255,0.07); color:white; }
        .nav-item.active { background:#1949c9; color:white; }
        .sidebar-foot { padding:16px 10px; border-top:1px solid rgba(255,255,255,0.08); }
        .user-info { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px; }
        .user-avatar { width:34px; height:34px; border-radius:50%; background:#1949c9; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:white; }
        .user-email { font-size:0.72rem; color:rgba(255,255,255,0.5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .btn-logout { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border-radius:8px; background:rgba(244,67,54,0.12); color:#ef9a9a; border:1px solid rgba(244,67,54,0.2); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; text-decoration:none; font-family:'Poppins',sans-serif; }
        .btn-logout:hover { background:rgba(244,67,54,0.22); color:#ff8a80; }
        .main-content { margin-left:240px; padding:32px; min-height:100vh; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
        .page-title { font-size:1.6rem; font-weight:800; color:#111; margin:0; }
        .card-admin { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid #f0f0f0; overflow:hidden; }
        .table th { font-family:'Poppins',sans-serif; font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:#90a4ae; font-weight:700; border-bottom:2px solid #f0f0f0; padding:14px 16px; }
        .table td { font-size:0.85rem; padding:12px 16px; vertical-align:middle; border-bottom:1px solid #f5f5f5; color:#333; }
        .badge-admin { background:#e3f2fd; color:#1565c0; font-size:0.62rem; padding:4px 10px; border-radius:20px; font-weight:700; letter-spacing:1px; }
        .badge-cliente { background:#e8f5e9; color:#2e7d32; font-size:0.62rem; padding:4px 10px; border-radius:20px; font-weight:700; letter-spacing:1px; }
        .badge-activo { background:#e8f5e9; color:#2e7d32; font-size:0.62rem; padding:4px 10px; border-radius:20px; font-weight:700; }
        .badge-inactivo { background:#fce4ec; color:#c62828; font-size:0.62rem; padding:4px 10px; border-radius:20px; font-weight:700; }
        .user-avatar-sm { width:36px; height:36px; border-radius:50%; background:#1949c9; display:flex; align-items:center; justify-content:center; color:white; font-size:0.85rem; font-weight:700; flex-shrink:0; }
        .btn-accion { padding:6px 12px; border-radius:7px; font-size:0.72rem; font-weight:700; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:5px; text-decoration:none; transition:all 0.2s; font-family:'Poppins',sans-serif; }
        .btn-ver { background:#e3f2fd; color:#1565c0; }
        .btn-ver:hover { background:#1949c9; color:white; }
        .btn-eliminar { background:#fce4ec; color:#c62828; }
        .btn-eliminar:hover { background:#c62828; color:white; }
        .alert-exito { background:#e8f5e9; border:1px solid #a5d6a7; border-radius:10px; color:#2e7d32; padding:12px 18px; font-size:0.85rem; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
        .alert-error { background:#fce4ec; border:1px solid #ef9a9a; border-radius:10px; color:#c62828; padding:12px 18px; font-size:0.85rem; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
        .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
        .stat-mini { background:white; border-radius:12px; padding:18px 20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid #f0f0f0; display:flex; align-items:center; gap:14px; }
        .stat-mini-icon { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
        .stat-mini-num { font-size:1.5rem; font-weight:800; color:#111; line-height:1; }
        .stat-mini-lbl { font-size:0.65rem; color:#90a4ae; text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
        <div class="sidebar-role"><i class="bi bi-shield-fill-check"></i> Panel Admin</div>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-lbl">Principal</span>
        <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <span class="nav-section-lbl">Gestion</span>
        <a th:href="@{/admin/productos}" class="nav-item"><i class="bi bi-box-seam"></i> Productos</a>
        <a th:href="@{/admin/categorias}" class="nav-item"><i class="bi bi-tags"></i> Categorias</a>
        <a th:href="@{/admin/pedidos}" class="nav-item"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a th:href="@{/admin/cotizaciones}" class="nav-item"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
        <a th:href="@{/admin/usuarios}" class="nav-item active"><i class="bi bi-people"></i> Usuarios</a>
        <span class="nav-section-lbl">Tienda</span>
        <a th:href="@{/}" class="nav-item"><i class="bi bi-shop"></i> Ver tienda</a>
    </nav>
    <div class="sidebar-foot">
        <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="user-email" sec:authentication="name">admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Cerrar sesion</button>
        </form>
    </div>
</aside>

<!-- Contenido -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">Usuarios</h1>
    </div>

    <!-- Alertas -->
    <div class="alert-exito" th:if="${exito}">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span>
    </div>
    <div class="alert-error" th:if="${error}">
        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
    </div>

    <!-- Stats -->
    <div class="stat-row">
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#e3f2fd;">
                <i class="bi bi-people-fill" style="color:#1949c9;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${usuarios.size()}">0</div>
                <div class="stat-mini-lbl">Total usuarios</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#e8f5e9;">
                <i class="bi bi-person-check-fill" style="color:#2e7d32;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${totalClientes}">0</div>
                <div class="stat-mini-lbl">Clientes</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="stat-mini-icon" style="background:#f3e5f5;">
                <i class="bi bi-shield-fill-check" style="color:#6a1b9a;"></i>
            </div>
            <div>
                <div class="stat-mini-num" th:text="${totalAdmins}">0</div>
                <div class="stat-mini-lbl">Admins</div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card-admin">
        <table class="table mb-0">
            <thead>
            <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="user-avatar-sm"
                             th:text="${#strings.toUpperCase(#strings.substring(u.nombre,0,1))}">A</div>
                        <strong th:text="${u.nombre}"></strong>
                    </div>
                </td>
                <td th:text="${u.email}"></td>
                <td>
                    <span class="badge-admin" th:if="${u.rol.name() == 'ROLE_ADMIN'}">Admin</span>
                    <span class="badge-cliente" th:if="${u.rol.name() == 'ROLE_CLIENTE'}">Cliente</span>
                </td>
                <td>
                    <span class="badge-activo" th:if="${u.activo}">Activo</span>
                    <span class="badge-inactivo" th:if="${!u.activo}">Inactivo</span>
                </td>
                <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <!-- Ver detalle -->
                        <a th:href="@{/admin/usuarios/detalle/{id}(id=${u.id})}"
                           class="btn-accion btn-ver">
                            <i class="bi bi-eye"></i> Ver
                        </a>
                        <!-- Activar/Desactivar -->
                        <form th:action="@{/admin/usuarios/estado/{id}(id=${u.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="activo" th:value="${!u.activo}">
                            <button type="submit" class="btn-accion"
                                    th:classappend="${u.activo} ? 'btn-eliminar' : 'btn-ver'">
                                <i th:class="${u.activo} ? 'bi bi-person-slash' : 'bi bi-person-check'"></i>
                                <span th:text="${u.activo} ? 'Desactivar' : 'Activar'"></span>
                            </button>
                        </form>
                        <!-- Eliminar -->
                        <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('¿Eliminar este usuario?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn-accion btn-eliminar">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
