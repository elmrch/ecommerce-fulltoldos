<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Usuario — Full Toldos Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="admin-page">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
        <div class="sidebar-role"><i class="bi bi-shield-fill-check"></i> Panel Admin</div>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-lbl">Principal</span>
        <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <span class="nav-section-lbl">Gestion</span>
        <a th:href="@{/admin/productos}" class="nav-item"><i class="bi bi-box-seam"></i> Productos</a>
        <a th:href="@{/admin/categorias}" class="nav-item"><i class="bi bi-tags"></i> Categorias</a>
        <a th:href="@{/admin/pedidos}" class="nav-item"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a th:href="@{/admin/cotizaciones}" class="nav-item"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
        <a th:href="@{/admin/usuarios}" class="nav-item active"><i class="bi bi-people"></i> Usuarios</a>
        <span class="nav-section-lbl">Tienda</span>
        <a th:href="@{/admin/envios}" class="nav-item"><i class="bi bi-truck"></i> Envíos</a>
        <a th:href="@{/}" class="nav-item"><i class="bi bi-shop"></i> Ver tienda</a>
    </nav>
    <div class="sidebar-foot">
        <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="user-email" sec:authentication="name">admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Cerrar sesion</button>
        </form>
    </div>
</aside>

<!-- Contenido -->
<main class="main-content">
    <div class="page-header">
        <a th:href="@{/admin/usuarios}" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <h1 class="page-title">Detalle de Usuario</h1>
    </div>

    <div class="alert-exito" th:if="${exito}">
        <i class="bi bi-check-circle-fill"></i><span th:text="${exito}"></span>
    </div>
    <div class="alert-error" th:if="${error}">
        <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
    </div>

    <div class="row g-4">
        <!-- Info del usuario -->
        <div class="col-lg-5">
            <div class="detail-card">
                <div class="detail-card-title"><i class="bi bi-person-circle"></i> Informacion</div>
                <div style="text-align:center;margin-bottom:20px;">
                    <div class="user-big-avatar"
                         th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre,0,1))}">A</div>
                    <div style="font-size:1.2rem;font-weight:800;color:#111;" th:text="${usuario.nombre}"></div>
                    <div style="font-size:0.82rem;color:#90a4ae;margin-top:4px;" th:text="${usuario.email}"></div>
                    <div style="margin-top:10px;">
                        <span class="badge-admin" th:if="${usuario.rol.name() == 'ROLE_ADMIN'}">Admin</span>
                        <span class="badge-cliente" th:if="${usuario.rol.name() == 'ROLE_CLIENTE'}">Cliente</span>
                        &nbsp;
                        <span class="badge-activo" th:if="${usuario.activo}">Activo</span>
                        <span class="badge-inactivo" th:if="${!usuario.activo}">Inactivo</span>
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-lbl">ID</span>
                    <span class="info-val" th:text="${usuario.id}"></span>
                </div>
                <div class="info-row">
                    <span class="info-lbl">Nombre</span>
                    <span class="info-val" th:text="${usuario.nombre}"></span>
                </div>
                <div class="info-row">
                    <span class="info-lbl">Email</span>
                    <span class="info-val" th:text="${usuario.email}"></span>
                </div>
                <div class="info-row">
                    <span class="info-lbl">Rol</span>
                    <span class="info-val" th:text="${usuario.rol}"></span>
                </div>
                <div class="info-row">
                    <span class="info-lbl">Estado</span>
                    <span class="info-val" th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
                </div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="col-lg-7">

            <!-- Cambiar rol -->
            <div class="detail-card">
                <div class="detail-card-title"><i class="bi bi-shield-lock"></i> Cambiar Rol</div>
                <form th:action="@{/admin/usuarios/rol/{id}(id=${usuario.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label">Rol actual</label>
                        <select name="rol" class="form-select">
                            <option value="ROLE_CLIENTE"
                                    th:selected="${usuario.rol.name() == 'ROLE_CLIENTE'}">Cliente</option>
                            <option value="ROLE_ADMIN"
                                    th:selected="${usuario.rol.name() == 'ROLE_ADMIN'}">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-shield-check"></i> Actualizar rol
                    </button>
                </form>
            </div>

            <!-- Reset password -->
            <div class="detail-card">
                <div class="detail-card-title"><i class="bi bi-key"></i> Resetear Password</div>
                <form th:action="@{/admin/usuarios/reset-password/{id}(id=${usuario.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label class="form-label">Nueva password</label>
                        <input type="password" name="nuevaPassword" class="form-control"
                               placeholder="Minimo 6 caracteres" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-key-fill"></i> Cambiar password
                    </button>
                </form>
            </div>

            <!-- Activar/Desactivar -->
            <div class="detail-card">
                <div class="detail-card-title"><i class="bi bi-toggle-on"></i> Estado de la cuenta</div>
                <form th:action="@{/admin/usuarios/estado/{id}(id=${usuario.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="activo" th:value="${!usuario.activo}">
                    <button type="submit" class="btn-guardar"
                            th:style="${usuario.activo} ? 'background:linear-gradient(135deg,#c62828,#b71c1c)' : 'background:linear-gradient(135deg,#2e7d32,#1b5e20)'">
                        <i th:class="${usuario.activo} ? 'bi bi-person-slash' : 'bi bi-person-check'"></i>
                        <span th:text="${usuario.activo} ? 'Desactivar cuenta' : 'Activar cuenta'"></span>
                    </button>
                </form>
            </div>

        </div>
    </div>
</main>

</body>
</html>
