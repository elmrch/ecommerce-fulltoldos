<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías — Full Toldos Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="admin-page">

<div class="mob-admin-bar">
    <button class="mob-admin-ham" onclick="document.querySelector('.sidebar').classList.toggle('mob-open');document.getElementById('mobAdminOverlay').classList.toggle('open')"><i class="bi bi-list"></i></button>
    <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
</div>
<div class="mob-admin-overlay" id="mobAdminOverlay" onclick="document.querySelector('.sidebar').classList.remove('mob-open');this.classList.remove('open')"></div>
<aside class="sidebar">
    <div class="sidebar-logo">
        <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
        <div class="sidebar-role"><i class="bi bi-shield-fill-check"></i> Panel Admin</div>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-lbl">Principal</span>
        <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <span class="nav-section-lbl">Gestión</span>
        <a th:href="@{/admin/productos}" class="nav-item"><i class="bi bi-box-seam"></i> Productos</a>
        <a th:href="@{/admin/categorias}" class="nav-item active"><i class="bi bi-tags"></i> Categorías</a>
        <a th:href="@{/admin/subcategorias}" class="nav-item"><i class="bi bi-diagram-3"></i> Subcategorías</a>
        <a th:href="@{/admin/pedidos}" class="nav-item"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a th:href="@{/admin/cotizaciones}" class="nav-item"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
        <a th:href="@{/admin/usuarios}" class="nav-item"><i class="bi bi-people"></i> Usuarios</a>
        <span class="nav-section-lbl">Tienda</span>
        <a th:href="@{/admin/envios}" class="nav-item"><i class="bi bi-truck"></i> Envíos</a>
        <a th:href="@{/}" class="nav-item"><i class="bi bi-shop"></i> Ver tienda</a>
    </nav>
    <div class="sidebar-foot">
        <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="user-email" sec:authentication="name">admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</button>
        </form>
    </div>
</aside>

<!-- Contenido -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">Categorías</h1>
        <a th:href="@{/admin/categorias/nueva}" class="btn-nuevo">
            <i class="bi bi-plus-lg"></i> Nueva Categoría
        </a>
    </div>

    <!-- Mensajes -->
    <div class="alert-exito" th:if="${exito}">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${exito}"></span>
    </div>
    <div class="alert-error" th:if="${error}">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="card-admin">
        <!-- Sin categorías -->
        <div class="empty-state" th:if="${#lists.isEmpty(categorias)}">
            <i class="bi bi-tags"></i>
            <p>No hay categorías aún</p>
        </div>

        <!-- Tabla -->
        <table class="table mb-0" th:if="${!#lists.isEmpty(categorias)}">
            <thead>
            <tr>
                <th>Imagen</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Orden</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cat : ${categorias}">
                <td>
                    <img th:if="${cat.imagenUrl != null}" th:src="${cat.imagenUrl}"
                         class="cat-img" th:alt="${cat.nombre}">
                    <div th:if="${cat.imagenUrl == null}" class="cat-img-ph">
                        <i class="bi bi-image"></i>
                    </div>
                </td>
                <td><strong th:text="${cat.nombre}"></strong></td>
                <td>
            <span th:if="${cat.descripcion != null}"
                  th:text="${#strings.abbreviate(cat.descripcion, 60)}"></span>
                    <span th:if="${cat.descripcion == null}" style="color:#ccc;">—</span>
                </td>
                <td th:text="${cat.orden}"></td>
                <td>
                    <span class="badge-activo" th:if="${cat.activo}">Activo</span>
                    <span class="badge-inactivo" th:if="${!cat.activo}">Inactivo</span>
                </td>
                <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <a th:href="@{/admin/categorias/editar/{id}(id=${cat.id})}"
                           class="btn-accion btn-editar">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <!-- Activar / Desactivar -->
                        <form th:action="@{/admin/categorias/estado/{id}(id=${cat.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="activo" th:value="${!cat.activo}">
                            <button type="submit" class="btn-accion"
                                    th:classappend="${cat.activo} ? 'btn-eliminar' : 'btn-editar'">
                                <i th:class="${cat.activo} ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                                <span th:text="${cat.activo} ? 'Desactivar' : 'Activar'"></span>
                            </button>
                        </form>
                        <!-- Eliminar -->
                        <form th:action="@{/admin/categorias/eliminar/{id}(id=${cat.id})}"
                              method="post" style="display:inline;"
                              onsubmit="confirmarEliminar(event,this,'Se eliminará la categoría «' + this.dataset.nombre + '». Esta acción no se puede deshacer.')"
                              th:attr="data-nombre=${cat.nombre}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn-accion btn-eliminar">
                                <i class="bi bi-trash3"></i> Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ═══ MODAL CONFIRMAR ELIMINAR (Bootstrap) ═══ -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center px-4 pt-4 pb-2">
                <div class="d-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10 mx-auto mb-3"
                     style="width:64px;height:64px;">
                    <i class="bi bi-trash3-fill text-danger fs-3"></i>
                </div>
                <h5 class="fw-bold mb-2">¿Eliminar categoría?</h5>
                <p id="confirmMsg" class="text-muted small mb-0"></p>
            </div>
            <div class="modal-footer border-0 justify-content-center gap-2 pb-4">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button" class="btn btn-danger px-4" id="confirmYesBtn">
                    <i class="bi bi-trash3-fill me-1"></i> Sí, eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var _pendingForm = null;
var _bsModal = null;
function confirmarEliminar(event, form, msg) {
    event.preventDefault();
    _pendingForm = form;
    document.getElementById('confirmMsg').textContent = msg;
    if (!_bsModal) _bsModal = new bootstrap.Modal(document.getElementById('confirmModal'));
    _bsModal.show();
}
document.getElementById('confirmYesBtn').addEventListener('click', function () {
    _bsModal.hide();
    if (_pendingForm) { _pendingForm.submit(); _pendingForm = null; }
});
</script>

</body>
</html>
