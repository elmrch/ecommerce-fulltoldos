<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' — Full Toldos Admin'">Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background:#f0f4ff; font-family:'Montserrat',sans-serif; margin:0; }
        .sidebar { position:fixed; top:0; left:0; width:240px; height:100vh; background:#111; display:flex; flex-direction:column; z-index:100; }
        .sidebar-logo { padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-logo img { height:40px; filter:brightness(0) invert(1); }
        .sidebar-role { font-size:0.58rem; letter-spacing:2px; text-transform:uppercase; color:#1949c9; font-weight:700; margin-top:6px; }
        .sidebar-nav { flex:1; padding:16px 10px; overflow-y:auto; }
        .nav-section-lbl { font-size:0.55rem; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.25); padding:10px 10px 6px; display:block; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color:rgba(255,255,255,0.55); text-decoration:none; font-size:0.82rem; font-weight:500; transition:all 0.18s; margin-bottom:2px; }
        .nav-item:hover { background:rgba(255,255,255,0.07); color:white; }
        .nav-item.active { background:#1949c9; color:white; }
        .sidebar-foot { padding:16px 10px; border-top:1px solid rgba(255,255,255,0.08); }
        .user-info { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px; }
        .user-avatar { width:34px; height:34px; border-radius:50%; background:#1949c9; display:flex; align-items:center; justify-content:center; font-size:0.9rem; color:white; }
        .user-email { font-size:0.72rem; color:rgba(255,255,255,0.5); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .btn-logout { display:flex; align-items:center; gap:8px; width:100%; padding:9px 12px; border-radius:8px; background:rgba(244,67,54,0.12); color:#ef9a9a; border:1px solid rgba(244,67,54,0.2); font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; text-decoration:none; font-family:'Montserrat',sans-serif; }
        .btn-logout:hover { background:rgba(244,67,54,0.22); color:#ff8a80; }
        .main-content { margin-left:240px; padding:32px; min-height:100vh; }
        .page-header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
        .page-title { font-size:1.6rem; font-weight:800; color:#111; margin:0; }
        .btn-volver { background:#f5f5f5; color:#555; padding:9px 16px; border-radius:8px; font-size:0.78rem; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:6px; transition:all 0.2s; border:1px solid #e0e0e0; }
        .btn-volver:hover { background:#e0e0e0; color:#333; }
        .form-card { background:white; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid #f0f0f0; padding:32px; max-width:700px; }
        .form-label { font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:#1949c9; font-weight:700; margin-bottom:6px; display:block; }
        .form-control, .form-select { border:1.5px solid #e0e0e0; border-radius:10px; padding:10px 14px; font-family:'Montserrat',sans-serif; font-size:0.9rem; transition:border-color 0.2s; outline:none; }
        .form-control:focus, .form-select:focus { border-color:#1949c9; box-shadow:0 0 0 3px rgba(25,73,201,0.1); }
        textarea.form-control { resize:vertical; min-height:100px; }
        .preview-img { width:120px; height:120px; object-fit:cover; border-radius:10px; border:2px solid #e0e0e0; margin-top:10px; display:block; }
        .btn-guardar { background:linear-gradient(135deg,#1949c9,#1237a8); color:white; padding:13px 32px; border-radius:10px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.92rem; border:none; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all 0.2s; }
        .btn-guardar:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(25,73,201,0.35); }
        .form-hint { font-size:0.72rem; color:#90a4ae; margin-top:4px; }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
        <div class="sidebar-role"><i class="bi bi-shield-fill-check"></i> Panel Admin</div>
    </div>
    <nav class="sidebar-nav">
        <span class="nav-section-lbl">Principal</span>
        <a th:href="@{/admin/dashboard}" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
        <span class="nav-section-lbl">Gestión</span>
        <a th:href="@{/admin/productos}" class="nav-item"><i class="bi bi-box-seam"></i> Productos</a>
        <a th:href="@{/admin/categorias}" class="nav-item active"><i class="bi bi-tags"></i> Categorías</a>
        <a th:href="@{/admin/pedidos}" class="nav-item"><i class="bi bi-bag-check"></i> Pedidos</a>
        <a th:href="@{/admin/cotizaciones}" class="nav-item"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
        <a th:href="@{/admin/usuarios}" class="nav-item"><i class="bi bi-people"></i> Usuarios</a>
        <span class="nav-section-lbl">Tienda</span>
        <a th:href="@{/}" class="nav-item"><i class="bi bi-shop"></i> Ver tienda</a>
    </nav>
    <div class="sidebar-foot">
        <div class="user-info">
            <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
            <div class="user-email" sec:authentication="name">admin</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</button>
        </form>
    </div>
</aside>

<!-- Contenido -->
<main class="main-content">
    <div class="page-header">
        <a th:href="@{/admin/categorias}" class="btn-volver">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <h1 class="page-title" th:text="${titulo}">Categoría</h1>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/categorias/guardar}" method="post"
              enctype="multipart/form-data"
              th:object="${categoria}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{imagenUrl}">

            <div class="mb-3">
                <label class="form-label">Nombre *</label>
                <input type="text" th:field="*{nombre}" class="form-control"
                       placeholder="Ej: Toldos Publicitarios" required maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control"
                          placeholder="Describe esta categoría..."></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Orden de aparición</label>
                <input type="number" th:field="*{orden}" class="form-control"
                       min="0" placeholder="0">
                <div class="form-hint">Número menor = aparece primero</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagen de categoría</label>
                <input type="file" name="imagenFile" class="form-control"
                       accept="image/jpeg,image/png,image/webp"
                       onchange="previewImagen(this)">
                <div class="form-hint">JPG, PNG o WEBP. Máximo 10MB.</div>
                <!-- Preview imagen actual -->
                <img th:if="${categoria.imagenUrl != null}"
                     th:src="${categoria.imagenUrl}"
                     id="imgPreview" class="preview-img" alt="Preview">
                <img th:if="${categoria.imagenUrl == null}"
                     id="imgPreview" class="preview-img"
                     src="" style="display:none;" alt="Preview">
            </div>

            <div class="mb-4">
                <div class="form-check">
                    <input type="checkbox" th:field="*{activo}"
                           class="form-check-input" id="activoCheck">
                    <label class="form-check-label" for="activoCheck"
                           style="font-size:0.88rem;">Categoría activa</label>
                </div>
            </div>

            <button type="submit" class="btn-guardar">
                <i class="bi bi-floppy-fill"></i> Guardar categoría
            </button>
        </form>
    </div>
</main>

<script>
    function previewImagen(input) {
      const preview = document.getElementById('imgPreview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
</script>

</body>
</html>
