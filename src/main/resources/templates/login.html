<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
    <style>
        body {
          background: #f0f4ff;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Poppins', sans-serif;
        }
        .login-wrapper {
          width: 100%;
          max-width: 440px;
          padding: 20px;
        }
        .login-card {
          background: white;
          border-radius: 20px;
          box-shadow: 0 8px 40px rgba(25,73,201,0.13);
          overflow: hidden;
        }
        .login-header {
          background: #1949c9;
          padding: 32px 36px 28px;
          text-align: center;
        }
        .login-header img {
          height: 52px;
          filter: brightness(0) invert(1);
          margin-bottom: 10px;
          display: block;
          margin-left: auto;
          margin-right: auto;
        }
        .login-header p {
          color: rgba(255,255,255,0.7);
          font-size: 0.82rem;
          margin: 0;
          letter-spacing: 0.5px;
        }
        .login-body {
          padding: 32px 36px 36px;
        }
        .form-label {
          font-size: 0.68rem;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: #1949c9;
          font-weight: 700;
          margin-bottom: 6px;
        }
        .form-control {
          border: 1.5px solid #e0e0e0;
          border-radius: 10px;
          padding: 11px 44px 11px 14px;
          font-family: 'Poppins', sans-serif;
          font-size: 0.92rem;
          transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
          border-color: #1949c9;
          box-shadow: 0 0 0 3px rgba(25,73,201,0.1);
        }
        .input-wrap {
          position: relative;
        }
        .input-wrap i {
          position: absolute;
          right: 14px;
          top: 50%;
          transform: translateY(-50%);
          color: #b0bec5;
          font-size: 1rem;
          pointer-events: none;
        }
        .input-wrap .toggle-pass {
          pointer-events: all;
          cursor: pointer;
        }
        .btn-login {
          width: 100%;
          background: linear-gradient(135deg, #1949c9, #1237a8);
          color: white;
          border: none;
          padding: 13px;
          border-radius: 10px;
          font-family: 'Poppins', sans-serif;
          font-weight: 700;
          font-size: 0.92rem;
          letter-spacing: 0.5px;
          cursor: pointer;
          transition: all 0.2s;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          margin-top: 8px;
        }
        .btn-login:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(25,73,201,0.35);
        }
        .alert-error {
          background: #fce4ec;
          border: 1px solid #ef9a9a;
          border-radius: 10px;
          color: #c62828;
          padding: 11px 16px;
          font-size: 0.83rem;
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 20px;
        }
        .alert-success {
          background: #e8f5e9;
          border: 1px solid #a5d6a7;
          border-radius: 10px;
          color: #2e7d32;
          padding: 11px 16px;
          font-size: 0.83rem;
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 20px;
        }
        .divider {
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 22px 0;
          color: #b0bec5;
          font-size: 0.75rem;
        }
        .divider::before, .divider::after {
          content: '';
          flex: 1;
          height: 1px;
          background: #e0e0e0;
        }
        .btn-registro {
          width: 100%;
          background: transparent;
          color: #1949c9;
          border: 1.5px solid #1949c9;
          padding: 11px;
          border-radius: 10px;
          font-family: 'Poppins', sans-serif;
          font-weight: 700;
          font-size: 0.88rem;
          cursor: pointer;
          transition: all 0.2s;
          text-decoration: none;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
        }
        .btn-registro:hover {
          background: #1949c9;
          color: white;
        }
        .back-home {
          text-align: center;
          margin-top: 20px;
        }
        .back-home a {
          font-size: 0.78rem;
          color: #90a4ae;
          text-decoration: none;
          display: inline-flex;
          align-items: center;
          gap: 5px;
          transition: color 0.2s;
        }
        .back-home a:hover { color: #1949c9; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Cabecera azul con logo -->
        <div class="login-header">
            <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <div class="login-body">

            <!-- Mensaje de error (credenciales incorrectas) -->
            <div class="alert-error" th:if="${param.error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                Email o contraseña incorrectos. Intenta de nuevo.
            </div>

            <!-- Mensaje de éxito (después de registrarse) -->
            <div class="alert-success" th:if="${param.registro}">
                <i class="bi bi-check-circle-fill"></i>
                Cuenta creada exitosamente. Ya puedes iniciar sesión.
            </div>

            <!-- Mensaje de cierre de sesión -->
            <div class="alert-success" th:if="${param.logout}">
                <i class="bi bi-box-arrow-left"></i>
                Sesión cerrada correctamente.
            </div>

            <!-- Formulario de login -->
            <!-- action="/login" es la URL que procesa Spring Security -->
            <form th:action="@{/login}" method="post">

                <!-- Token CSRF (Spring Security lo requiere) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-wrap">
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="tucorreo@email.com"
                               required
                               autofocus>
                        <i class="bi bi-envelope"></i>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password"
                               id="passInput"
                               name="password"
                               class="form-control"
                               placeholder="••••••••"
                               required>
                        <i class="bi bi-eye toggle-pass"
                           id="togglePass"
                           onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- Botón ingresar -->
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Ingresar
                </button>

            </form>

            <!-- Separador -->
            <div class="divider">¿No tienes cuenta?</div>

            <!-- Botón registro -->
            <a th:href="@{/registro}" class="btn-registro">
                <i class="bi bi-person-plus"></i>
                Crear cuenta nueva
            </a>

        </div>
    </div>

    <!-- Volver al inicio -->
    <div class="back-home">
        <a th:href="@{/}">
            <i class="bi bi-arrow-left"></i>
            Volver a la tienda
        </a>
    </div>
</div>

<script>
    function togglePassword() {
      const input = document.getElementById('passInput');
      const icon  = document.getElementById('togglePass');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
</script>

</body>
</html>
