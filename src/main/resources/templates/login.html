<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="auth-page">

<div class="login-wrapper">
    <div class="login-card">

        <!-- Cabecera azul con logo -->
        <div class="login-header">
            <img th:src="@{/logofulltoldos.png}" alt="Full Toldos">
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <div class="login-body">

            <!-- Mensaje de error (credenciales incorrectas) -->
            <div class="alert-error" th:if="${param.error}">
                <i class="bi bi-exclamation-circle-fill"></i>
                Email o contraseña incorrectos. Intenta de nuevo.
            </div>

            <!-- Mensaje de éxito (después de registrarse) -->
            <div class="alert-success" th:if="${param.registro}">
                <i class="bi bi-check-circle-fill"></i>
                Cuenta creada exitosamente. Ya puedes iniciar sesión.
            </div>

            <!-- Mensaje de cierre de sesión -->
            <div class="alert-success" th:if="${param.logout}">
                <i class="bi bi-box-arrow-left"></i>
                Sesión cerrada correctamente.
            </div>

            <!-- Formulario de login -->
            <!-- action="/login" es la URL que procesa Spring Security -->
            <form th:action="@{/login}" method="post">

                <!-- Token CSRF (Spring Security lo requiere) -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <div class="input-wrap">
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="tucorreo@email.com"
                               required
                               autofocus>
                        <i class="bi bi-envelope"></i>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <div class="input-wrap">
                        <input type="password"
                               id="passInput"
                               name="password"
                               class="form-control"
                               placeholder="••••••••"
                               required>
                        <i class="bi bi-eye toggle-pass"
                           id="togglePass"
                           onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- Botón ingresar -->
                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Ingresar
                </button>

            </form>

            <!-- Separador -->
            <div class="divider">¿No tienes cuenta?</div>

            <!-- Botón registro -->
            <a th:href="@{/registro}" class="btn-registro">
                <i class="bi bi-person-plus"></i>
                Crear cuenta nueva
            </a>

        </div>
    </div>

    <!-- Volver al inicio -->
    <div class="back-home">
        <a th:href="@{/}">
            <i class="bi bi-arrow-left"></i>
            Volver a la tienda
        </a>
    </div>
</div>

<script>
    function togglePassword() {
      const input = document.getElementById('passInput');
      const icon  = document.getElementById('togglePass');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
</script>

</body>
</html>
