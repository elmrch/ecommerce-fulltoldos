<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="cliente-page">

<!-- ── Navbar ── -->
<nav class="navbar-cli">
    <div class="navbar-inner">
        <a th:href="@{/}"><img th:src="@{/logofulltoldos.png}" alt="Full Toldos"></a>
        <div class="nav-links-cli">
            <a th:href="@{/cliente/inicio}"    class="nav-link-cli"><i class="bi bi-house"></i> Inicio</a>
            <a th:href="@{/cliente/carrito}"   class="nav-link-cli"><i class="bi bi-bag"></i> Carrito</a>
            <a th:href="@{/cliente/pedidos}"   class="nav-link-cli"><i class="bi bi-bag-check"></i> Pedidos</a>
            <a th:href="@{/cliente/cotizaciones}" class="nav-link-cli"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
            <a th:href="@{/cliente/perfil}"    class="nav-link-cli active"><i class="bi bi-person"></i> Perfil</a>
        </div>
        <div class="nav-right-cli">
            <div class="user-pill">
                <i class="bi bi-person-circle"></i>
                <span th:text="${emailCliente}">cliente@email.com</span>
            </div>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-logout-top">
                    <i class="bi bi-box-arrow-left"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ── Contenido ── -->
<div class="main-wrap">
    <div class="section-title">Mi perfil</div>

    <div th:if="${ok}" class="alert-ok"><i class="bi bi-check-circle-fill"></i> <span th:text="${ok}"></span></div>
    <div th:if="${error}" class="alert-error"><i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span></div>

    <div class="settings-group">
        <div class="settings-group-header">
            <i class="bi bi-person"></i><span>Datos personales</span>
        </div>
        <form th:action="@{/cliente/perfil}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="settings-row">
                <div class="settings-lbl"><div>Nombre completo</div></div>
                <input class="settings-input" type="text" name="nombre"
                       th:value="${usuario != null ? usuario.nombre : ''}" required>
            </div>
            <div class="settings-row">
                <div class="settings-lbl"><div>Correo electrónico</div></div>
                <input class="settings-input" type="email" th:value="${emailCliente}" disabled style="opacity:0.6;">
            </div>
            <div style="padding:16px 24px;">
                <button type="submit" class="save-btn"><i class="bi bi-floppy"></i> Guardar cambios</button>
            </div>
        </form>
    </div>

    <div class="settings-group">
        <div class="settings-group-header">
            <i class="bi bi-shield-lock"></i><span>Cambiar contraseña</span>
        </div>
        <form th:action="@{/cliente/perfil/password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="settings-row">
                <div class="settings-lbl"><div>Contraseña actual</div></div>
                <input class="settings-input" type="password" name="actual" required>
            </div>
            <div class="settings-row">
                <div class="settings-lbl"><div>Nueva contraseña</div></div>
                <input class="settings-input" type="password" name="nueva" required minlength="6">
            </div>
            <div style="padding:16px 24px;">
                <button type="submit" class="save-btn"><i class="bi bi-key"></i> Actualizar contraseña</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
