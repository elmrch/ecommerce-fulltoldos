<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Carrito de Compras — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
    <style>
        body { background: #f0f4ff; }

        /* ── Navbar (igual a inicio.html) ── */
        .navbar-cli {
            background: #1949c9;
            padding: 0;
            box-shadow: 0 2px 16px rgba(25,73,201,0.25);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar-inner-cli {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 12px 28px; gap: 16px;
            max-width: 1200px; margin: 0 auto;
        }
        .navbar-inner-cli img { height: 40px; }
        .nav-links-cli { display: flex; align-items: center; gap: 4px; }
        .nav-link-cli {
            color: rgba(255,255,255,0.75); text-decoration: none;
            font-size: 0.8rem; font-weight: 500; padding: 8px 14px;
            border-radius: 8px; transition: all 0.18s;
            display: flex; align-items: center; gap: 6px;
        }
        .nav-link-cli:hover, .nav-link-cli.active {
            background: rgba(255,255,255,0.15); color: white;
        }
        .nav-right-cli { display: flex; align-items: center; gap: 10px; }
        .user-pill {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px; padding: 6px 14px 6px 8px;
            display: flex; align-items: center; gap: 7px;
            color: white; font-size: 0.75rem;
        }
        .btn-nav-action {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85); padding: 7px 14px;
            border-radius: 8px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; transition: all 0.18s;
            display: flex; align-items: center; gap: 6px;
            font-family: 'Poppins', sans-serif; text-decoration: none;
        }
        .btn-nav-action:hover { background: rgba(255,255,255,0.22); color: white; }

        /* ── Banner breadcrumb ── */
        .cart-banner {
            background: #111827;
            background-image: repeating-linear-gradient(
                45deg, transparent, transparent 20px,
                rgba(255,255,255,0.02) 20px, rgba(255,255,255,0.02) 40px
            );
            padding: 38px 20px; text-align: center;
        }
        .cart-steps {
            display: flex; align-items: center; justify-content: center;
            gap: 14px; flex-wrap: wrap;
        }
        .cart-step {
            font-size: 0.92rem; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; color: rgba(255,255,255,0.3);
        }
        .cart-step.active {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 7px;
            text-decoration-color: #1949c9;
            text-decoration-thickness: 2px;
        }
        .cart-step-arrow { color: rgba(255,255,255,0.2); font-size: 0.8rem; }

        /* ── Layout ── */
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 36px 20px 70px; }

        /* ── Tabla ── */
        .cart-table-wrap {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            border: 1.5px solid #eef0f5;
            overflow: hidden;
        }
        .cart-table-header {
            display: grid;
            grid-template-columns: 36px 84px 1fr 120px 160px 130px;
            padding: 13px 20px;
            border-bottom: 2px solid #eef0f5;
            background: #f8f9fb;
        }
        .cart-th {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: #6b7280;
            display: flex; align-items: center;
        }
        .cart-th.center { justify-content: center; }
        .cart-th.right  { justify-content: flex-end; }

        #cartTableBody { padding: 0 20px; }

        .cart-row {
            display: grid;
            grid-template-columns: 36px 84px 1fr 120px 160px 130px;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f0f2f7;
        }
        .cart-row:last-child { border-bottom: none; }

        .cart-row-del {
            display: flex; align-items: center; justify-content: center;
        }
        .cart-row-del button {
            width: 22px; height: 22px; border: none; background: none;
            color: #c0c4cc; font-size: 0.82rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: all 0.18s;
        }
        .cart-row-del button:hover { background: #fce4ec; color: #c62828; }

        .cart-row-img {
            width: 72px; height: 72px; border-radius: 10px;
            border: 1.5px solid #eef0f5; overflow: hidden;
            background: #f8f9fb;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-row-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .cart-row-name {
            padding: 0 16px;
            font-weight: 700; font-size: 0.88rem; color: #1a1a1a; line-height: 1.4;
        }
        .cart-row-price {
            font-weight: 600; font-size: 0.9rem; color: #4a5568;
        }
        .cart-row-qty {
            display: flex; align-items: center; justify-content: center;
        }
        .qty-ctrl {
            display: flex; align-items: center;
            border: 1.5px solid #e8eaf0; border-radius: 8px; overflow: hidden;
        }
        .qty-btn {
            width: 32px; height: 34px; border: none;
            background: #f5f6f8; color: #555;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .qty-btn:hover { background: #1949c9; color: white; }
        .qty-val {
            min-width: 40px; text-align: center;
            font-size: 0.88rem; font-weight: 700; color: #1a1a1a;
            border-left: 1.5px solid #e8eaf0;
            border-right: 1.5px solid #e8eaf0;
            height: 34px; display: flex; align-items: center; justify-content: center;
        }
        .cart-row-subtotal {
            font-weight: 700; font-size: 0.95rem;
            color: #1949c9;
            display: flex; justify-content: flex-end;
        }

        /* ── Barra inferior ── */
        .cart-bottom-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px; border-top: 2px solid #eef0f5;
            flex-wrap: wrap; gap: 12px;
        }
        .coupon-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .coupon-input {
            padding: 10px 18px; border: 1.5px solid #e8eaf0;
            border-radius: 50px; font-family: 'Poppins', sans-serif;
            font-size: 0.84rem; color: #1a1a1a; outline: none;
            min-width: 190px; transition: border-color 0.2s;
        }
        .coupon-input:focus { border-color: #1949c9; }
        .coupon-input::placeholder { color: #b0b8c8; }
        .btn-coupon {
            padding: 10px 22px; border-radius: 50px;
            background: #1949c9; color: white; border: none;
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-coupon:hover { background: #1237a8; }
        .btn-update {
            padding: 10px 22px; border-radius: 50px;
            background: none; color: #6b7280; border: 1.5px solid #e8eaf0;
            font-family: 'Poppins', sans-serif; font-weight: 700;
            font-size: 0.78rem; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-update:hover { border-color: #1949c9; color: #1949c9; }

        /* ── Sidebar totales ── */
        .sidebar-totales {
            background: white; border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.07);
            border: 1.5px solid #eef0f5;
            padding: 24px 22px;
            position: sticky; top: 80px;
        }
        .totales-title {
            font-size: 0.85rem; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; color: #1a1a1a;
            margin-bottom: 18px; padding-bottom: 14px;
            border-bottom: 2px solid #eef0f5;
        }
        .totales-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 0; border-bottom: 1px solid #f0f2f7;
            font-size: 0.88rem;
        }
        .totales-row:last-of-type { border-bottom: none; margin-bottom: 18px; }
        .totales-lbl { font-weight: 600; color: #1a1a1a; }
        .totales-val { font-weight: 700; color: #4a5568; }
        .totales-val.total { font-size: 1rem; color: #1949c9; font-weight: 800; }

        .btn-finalizar {
            width: 100%; padding: 14px;
            background: #1949c9; color: white; border: none;
            border-radius: 50px; font-family: 'Poppins', sans-serif;
            font-weight: 800; font-size: 0.82rem; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.2s; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-finalizar:hover {
            background: #1237a8;
            box-shadow: 0 4px 16px rgba(25,73,201,0.35);
            transform: translateY(-1px);
        }
        .btn-wsp-pedido {
            width: 100%; padding: 13px;
            background: #25d366; color: white; border: none;
            border-radius: 50px; font-family: 'Poppins', sans-serif;
            font-weight: 700; font-size: 0.82rem;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-wsp-pedido:hover { background: #128c7e; }

        /* ── Vacío ── */
        .cart-empty-state {
            text-align: center; padding: 70px 20px;
        }
        .cart-empty-state i { font-size: 3.5rem; color: #e0e0e0; display: block; margin-bottom: 16px; }
        .cart-empty-state p { color: #aaa; font-size: 0.88rem; margin-bottom: 24px; }
        .cart-empty-state a {
            display: inline-flex; align-items: center; gap: 8px;
            background: #1949c9; color: white;
            padding: 12px 28px; border-radius: 50px;
            font-weight: 700; font-size: 0.84rem;
            text-decoration: none; transition: all 0.2s;
        }
        .cart-empty-state a:hover { background: #1237a8; color: white; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .cart-table-header { display: none; }
            .cart-row {
                grid-template-columns: 32px 68px 1fr;
                grid-template-rows: auto auto auto;
                gap: 6px 0;
            }
            .cart-row-price  { grid-column: 3; padding-left: 16px; font-size: 0.82rem; }
            .cart-row-qty    { grid-column: 3; justify-content: flex-start; padding-left: 16px; }
            .cart-row-subtotal { grid-column: 3; padding-left: 16px; justify-content: flex-start; }
        }
        @media (max-width: 576px) {
            .navbar-inner-cli { padding: 10px 16px; }
            .nav-links-cli { display: none; }
            .cart-bottom-bar { flex-direction: column; }
            .coupon-input { min-width: unset; width: 100%; }
        }
    </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar-cli">
    <div class="navbar-inner-cli">
        <a th:href="@{/}">
            <img th:src="@{/logofulltoldos.png}" src="/logofulltoldos.png" alt="Full Toldos">
        </a>
        <div class="nav-links-cli">
            <a th:href="@{/cliente/inicio}" class="nav-link-cli">
                <i class="bi bi-house-fill"></i> Inicio
            </a>
            <a th:href="@{/cliente/carrito}" class="nav-link-cli active">
                <i class="bi bi-bag-fill"></i> Carrito
            </a>
            <a th:href="@{/cliente/pedidos}" class="nav-link-cli">
                <i class="bi bi-bag-check-fill"></i> Pedidos
            </a>
            <a th:href="@{/cliente/perfil}" class="nav-link-cli">
                <i class="bi bi-person-gear"></i> Perfil
            </a>
        </div>
        <div class="nav-right-cli">
            <div sec:authorize="isAuthenticated()" class="user-pill">
                <i class="bi bi-person-fill"></i>
                <span sec:authentication="name">Usuario</span>
            </div>
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn-nav-action">
                        <i class="bi bi-box-arrow-left"></i> Salir
                    </button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn-nav-action">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ── Banner ── -->
<div class="cart-banner">
    <div class="cart-steps">
        <span class="cart-step active">Carrito</span>
        <span class="cart-step-arrow"><i class="bi bi-arrow-right"></i></span>
        <span class="cart-step">Finalizar Compra</span>
        <span class="cart-step-arrow"><i class="bi bi-arrow-right"></i></span>
        <span class="cart-step">Pedido Completado</span>
    </div>
</div>

<!-- ── Contenido ── -->
<div class="page-wrap">
    <div class="row g-4 align-items-start">

        <!-- Tabla -->
        <div class="col-lg-8">
            <div class="cart-table-wrap">
                <div class="cart-table-header" id="cartTableHeader" style="display:none;">
                    <div class="cart-th"></div>
                    <div class="cart-th"></div>
                    <div class="cart-th" style="padding-left:16px;">Producto</div>
                    <div class="cart-th">Precio</div>
                    <div class="cart-th center">Cantidad</div>
                    <div class="cart-th right">Subtotal</div>
                </div>

                <div id="cartTableBody"></div>

                <div class="cart-bottom-bar" id="cartBottomBar" style="display:none;">
                    <div class="coupon-group">
                        <input type="text" class="coupon-input" id="couponInput" placeholder="Código de cupón">
                        <button class="btn-coupon" onclick="applyCoupon()">APLICAR CUPÓN</button>
                    </div>
                    <button class="btn-update" onclick="renderCartPage()">ACTUALIZAR CARRITO</button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="col-lg-4">
            <div class="sidebar-totales" id="sidebarTotales" style="display:none;">
                <div class="totales-title">Totales del Carrito</div>
                <div class="totales-row">
                    <span class="totales-lbl">Subtotal</span>
                    <span class="totales-val" id="pageSubtotal">S/0.00</span>
                </div>
                <div class="totales-row">
                    <span class="totales-lbl">Total</span>
                    <span class="totales-val total" id="pageTotal">S/0.00</span>
                </div>
                <button class="btn-finalizar" onclick="sendCartWsp()">Finalizar Compra</button>
                <button class="btn-wsp-pedido" onclick="sendCartWsp()">
                    <i class="bi bi-whatsapp"></i> Pedir por WhatsApp
                </button>
            </div>
        </div>

    </div>
</div>

<script>
const CART_KEY = 'ft_cart';
const fmt = n => Number(n).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});

function loadCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; }
}
function saveCart(c) { localStorage.setItem(CART_KEY, JSON.stringify(c)); }

function changeQty(id, delta) {
    let cart = loadCart();
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty = Math.max(1, item.qty + delta);
    saveCart(cart);
    renderCartPage();
}

function removeItem(id) {
    saveCart(loadCart().filter(i => i.id !== id));
    renderCartPage();
}

function applyCoupon() {
    const code = document.getElementById('couponInput').value.trim();
    if (!code) return;
    alert('Cupón "' + code + '" no válido.');
}

function sendCartWsp() {
    const cart = loadCart();
    if (!cart.length) return;
    const lines = cart.map(i => `• *${i.name}* (x${i.qty})`).join('%0A');
    window.open('https://wa.me/51999999999?text=Hola Full Toldos! Deseo cotizar:%0A' + lines, '_blank');
}

function renderCartPage() {
    const cart = loadCart();
    const body    = document.getElementById('cartTableBody');
    const sidebar = document.getElementById('sidebarTotales');
    const bottom  = document.getElementById('cartBottomBar');
    const header  = document.getElementById('cartTableHeader');

    if (!cart.length) {
        header.style.display  = 'none';
        bottom.style.display  = 'none';
        sidebar.style.display = 'none';
        body.innerHTML = `
            <div class="cart-empty-state">
                <i class="bi bi-bag"></i>
                <p>Tu carrito está vacío</p>
                <a href="/"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
            </div>`;
        return;
    }

    header.style.display  = 'grid';
    bottom.style.display  = 'flex';
    sidebar.style.display = 'block';

    let total = 0;
    body.innerHTML = cart.map(item => {
        const precio = (item.precio != null && Number(item.precio) > 0) ? Number(item.precio) : 0;
        const subtotal = precio * item.qty;
        total += subtotal;
        const img = (item.imgs && item.imgs[0])
            ? `<img src="${item.imgs[0]}" alt="${item.name}" onerror="this.style.display='none'">`
            : `<i class="bi ${item.icon || 'bi-box'}" style="font-size:2rem;color:#1949c9"></i>`;
        return `
        <div class="cart-row">
            <div class="cart-row-del">
                <button onclick="removeItem(${item.id})" title="Eliminar"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="cart-row-img">${img}</div>
            <div class="cart-row-name">${item.name.toUpperCase()}</div>
            <div class="cart-row-price">${precio > 0 ? 'S/' + fmt(precio) : 'Consultar'}</div>
            <div class="cart-row-qty">
                <div class="qty-ctrl">
                    <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                    <span class="qty-val">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                </div>
            </div>
            <div class="cart-row-subtotal">${precio > 0 ? 'S/' + fmt(subtotal) : '—'}</div>
        </div>`;
    }).join('');

    const str = total > 0 ? 'S/' + fmt(total) : '—';
    document.getElementById('pageSubtotal').textContent = str;
    document.getElementById('pageTotal').textContent    = str;
}

document.addEventListener('DOMContentLoaded', renderCartPage);
</script>

</body>
</html>
