<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos — Full Toldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/estilo.css}" rel="stylesheet">
</head>
<body class="cliente-page">

<!-- ── Navbar ── -->
<nav class="navbar-cli">
    <div class="navbar-inner">
        <a th:href="@{/}"><img th:src="@{/logofulltoldos.png}" alt="Full Toldos"></a>
        <div class="nav-links-cli">
            <a th:href="@{/cliente/inicio}"    class="nav-link-cli"><i class="bi bi-house"></i> Inicio</a>
            <a th:href="@{/cliente/carrito}"   class="nav-link-cli"><i class="bi bi-bag"></i> Carrito</a>
            <a th:href="@{/cliente/pedidos}"   class="nav-link-cli active"><i class="bi bi-bag-check"></i> Pedidos</a>
            <a th:href="@{/cliente/cotizaciones}" class="nav-link-cli"><i class="bi bi-file-earmark-text"></i> Cotizaciones</a>
            <a th:href="@{/cliente/perfil}"    class="nav-link-cli"><i class="bi bi-person"></i> Perfil</a>
        </div>
        <div class="nav-right-cli">
            <div class="user-pill">
                <i class="bi bi-person-circle"></i>
                <span th:text="${emailCliente}">cliente@email.com</span>
            </div>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-logout-top">
                    <i class="bi bi-box-arrow-left"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ── Contenido ── -->
<div class="main-wrap">
    <div class="section-title">Mis pedidos</div>

    <div class="cotiz-table">
        <div th:if="${pedidos == null or #lists.isEmpty(pedidos)}" class="empty-state">
            <i class="bi bi-bag"></i>
            <p>Todavía no tienes pedidos.</p>
        </div>
        <table th:if="${pedidos != null and not #lists.isEmpty(pedidos)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Productos</th>
                    <th>Envío</th>
                    <th>Total</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="${p.id}">1</td>
                    <td>
                        <div class="msg-col" th:each="it : ${p.items}" th:text="${it.nombre + ' x' + it.cantidad}">-</div>
                    </td>
                    <td>
                        <div th:text="${p.direccion}">-</div>
                        <div class="fecha-col" th:text="${p.ciudad}">-</div>
                    </td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.total,1,2)}">S/ 0.00</td>
                    <td class="fecha-col" th:text="${#temporals.format(p.fechaCreacion, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td><span class="badge-estado" th:classappend="'badge-' + ${p.estado}" th:text="${p.estado}">PENDIENTE_PAGO</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
