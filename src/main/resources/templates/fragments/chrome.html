<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="chrome">

<!-- ═══ CART DRAWER ═══ -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
        <span class="cart-head-title">Carrito</span>
        <button class="cart-x" onclick="closeCart()"><i class="bi bi-x-lg"></i> Cerrar</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot" id="cartFoot"></div>
</div>

<!-- ═══ LIGHTBOX ═══ -->
<div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" onclick="closeLightbox()"><i class="bi bi-x-lg"></i></button>
    <button class="lightbox-prev" onclick="lightboxNav(-1)"><i class="bi bi-chevron-left"></i></button>
    <button class="lightbox-next" onclick="lightboxNav(1)"><i class="bi bi-chevron-right"></i></button>
    <div class="lightbox-content">
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <div>
                <div id="lightboxName" class="lightbox-name"></div>
                <div id="lightboxCat" class="lightbox-cat"></div>
            </div>
            <button class="lightbox-view-btn" id="lightboxViewBtn" onclick="lightboxGoProduct()">
                <i class="bi bi-eye-fill"></i> Ver producto
            </button>
        </div>
    </div>
</div>

<!-- ═══ MOBILE MENU ═══ -->
<div class="mob-overlay" id="mobOverlay" onclick="closeMobileMenu()"></div>
<div class="mob-drawer" id="mobDrawer">
    <!-- Cabecera -->
    <div class="mob-head">
        <img th:src="@{/img/logofulltoldos.png}" src="logofulltoldos.png"
             alt="Full Toldos" class="mob-logo">
        <div class="mob-head-right">
            <button class="mob-close-btn" onclick="closeMobileMenu()"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>
    <!-- Búsqueda -->
    <div class="mob-search-row">
        <div class="mob-search-box">
            <input type="text" id="mobSearchInput" placeholder="Buscar productos...">
            <button onclick="doMobSearch()"><i class="bi bi-search"></i></button>
        </div>
    </div>
    <!-- Menú -->
    <div id="mobNav" class="mob-nav"></div>
    <!-- Footer -->
    <div class="mob-footer">
        <a th:href="${wspLink}" href="#" target="_blank" class="mob-footer-wsp">
            <i class="bi bi-whatsapp"></i> WhatsApp
        </a>
        <a th:href="@{/cotizar}" onclick="closeMobileMenu()" class="btn-cotizar" style="flex:1;justify-content:center;font-size:0.78rem;padding:10px 10px;">
            <i class="bi bi-chat-text-fill"></i> Cotización
        </a>
    </div>
</div>

<!-- ═══ POPUP BIENVENIDA ═══ -->
<div class="wpopup-overlay" id="wpopupOverlay" onclick="closeWelcomePopup(event)">
  <div class="wpopup">
    <button class="wpopup-close" onclick="closeWelcomePopup()"><i class="bi bi-x-lg"></i></button>
    <div class="wpopup-body">
      <img th:src="@{/logofulltoldos.png}" alt="Full Toldos" class="wpopup-logo">
      <div class="wpopup-title">¡Suscríbete y recibe<br><span>ofertas exclusivas</span></div>
      <div class="wpopup-sub">Entérate primero de nuevos productos, promociones y precios especiales.</div>
      <form class="wpopup-form" onsubmit="submitWelcomeEmail(event)">
        <label class="wpopup-label">Correo electrónico <span style="color:#e53e3e">*</span></label>
        <input type="email" class="wpopup-input" id="wpopupEmail" placeholder="tucorreo@email.com" required>
        <button type="submit" class="wpopup-btn">Suscribirme</button>
      </form>
      <div class="wpopup-note">*No compartimos tu información con terceros.</div>
    </div>
    <div class="wpopup-img-area">
      <img th:src="@{/img/imgfooter.png}" src="img/imgfooter.png" alt="Full Toldos" onerror="this.parentElement.style.display='none'">
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-ft" id="toastFt"><i class="bi bi-check-circle-fill"></i> <span id="toastMsg">Agregado</span></div>

<!-- WhatsApp FAB -->
<a th:href="${wspLink}" class="wsp-fab" target="_blank">
    <i class="bi bi-whatsapp"></i>
</a>

<!-- Scroll Top -->
<button class="scroll-top" id="scrollTopBtn"
        onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="bi bi-chevron-up"></i>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
var DB_CATS     = /*[[${dbCats}]]*/ [];
var DB_PRODUCTS = /*[[${dbProducts}]]*/ [];
/*]]>*/
</script>
<script th:src="@{/scrip.js}"></script>

</th:block>
</body>
</html>
